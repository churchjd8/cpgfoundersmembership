<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CPG Founders Group Logo v8</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #fff;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #1a1a1a;
    }
    .logo svg {
      width: 88px;
      height: 64px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Back left mountain (shortest, lightest, behind) -->
      <path d="M10 18L19 27H1Z" fill="#fbbf24" />
      <!-- Back center mountain (tallest, darkest, with flag) -->
      <path d="M20 7L33 27H7Z" fill="#b45309" />
      <!-- Flag pole -->
      <line x1="20" y1="1" x2="20" y2="7" stroke="#92400e" stroke-width="1.8" stroke-linecap="round" />
      <!-- Flag -->
      <path d="M20.2 1L25.5 3.5L20.2 5.5" fill="#d97706" stroke="#92400e" stroke-width="0.5" stroke-linejoin="round" />
      <!-- Front right mountain (medium, orange, in front) -->
      <path d="M30 14L41 27H19Z" fill="#d97706" />
    </svg>
    CPG Founders Group
  </div>
</body>
</html>
