<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CPG Founders Group Logo v3</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #fff;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #1a1a1a;
    }
    .logo svg {
      width: 80px;
      height: 64px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 44 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Back mountain (shorter, left side, tucked in closer) -->
      <path d="M12 14L23 27H1Z" fill="#d97706" />
      <!-- Front mountain (taller, solid, with flag) -->
      <path d="M22 8L34 27H10Z" fill="#b45309" />
      <!-- Flag pole -->
      <line x1="22" y1="2" x2="22" y2="8" stroke="#92400e" stroke-width="1.8" stroke-linecap="round" />
      <!-- Flag -->
      <path d="M22.2 2L27.5 4.5L22.2 6.5" fill="#d97706" stroke="#92400e" stroke-width="0.5" stroke-linejoin="round" />
    </svg>
    CPG Founders Group
  </div>
</body>
</html>
