<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@900&display=block" rel="stylesheet">
<style>
  :root {
    --navy: #0b1a2e;
    --ridge: #1b3a5f;
    --gold: #dfa13c;
    --signal: #2b4cf0;
    --cream: #f7f3ec;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1500px; }
  body {
    background: var(--cream);
    font-family: 'Inter', sans-serif;
    color: var(--navy);
    position: relative;
    overflow: hidden;
  }
  .frame {
    position: absolute; inset: 0;
    padding: 72px 80px 70px;
    display: flex; flex-direction: column;
  }

  /* Masthead */
  .masthead {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding-bottom: 26px;
    border-bottom: 3px solid var(--navy);
  }
  .featured {
    font-size: 22px; font-weight: 700; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--ridge);
    margin-bottom: 4px;
  }
  .inc {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 168px;
    line-height: 0.78;
    letter-spacing: -0.03em;
    color: #000;
  }
  .listname {
    text-align: right;
    font-size: 26px; font-weight: 800; letter-spacing: 0.22em;
    text-transform: uppercase; line-height: 1.35;
  }
  .listname span { color: var(--gold); }

  /* Photo */
  .photo {
    position: relative;
    margin-top: 44px;
    height: 760px;
    border-radius: 28px;
    overflow: hidden;
    background: url('jeff.jpg') center 18% / cover no-repeat;
  }
  .photo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(11,26,46,0) 55%, rgba(11,26,46,0.55) 100%);
  }
  .rank {
    position: absolute; z-index: 2;
    right: 36px; bottom: 36px;
    width: 220px; height: 220px; border-radius: 50%;
    background: var(--gold);
    border: 8px solid var(--cream);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 18px 40px rgba(11,26,46,0.35);
  }
  .rank .num {
    font-size: 116px; font-weight: 900; line-height: 0.9; letter-spacing: -0.04em;
    color: var(--navy);
  }
  .rank .num sup { font-size: 0.45em; vertical-align: 0.95em; margin-right: 2px; }
  .rank .lbl {
    font-size: 17px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--navy); margin-top: 6px;
  }

  /* Name block */
  .who {
    margin-top: 46px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .name {
    font-size: 88px; font-weight: 900; letter-spacing: -0.03em; line-height: 1;
  }
  .org {
    display: flex; align-items: center; gap: 16px;
    font-size: 34px; font-weight: 800; letter-spacing: -0.01em;
  }
  .org img { width: 84px; height: 56px; }

  .statement {
    margin-top: 30px;
    font-size: 44px; font-weight: 500; line-height: 1.3; letter-spacing: -0.01em;
    color: var(--ridge);
  }
  .statement b { color: var(--navy); font-weight: 800; }

  .footer {
    margin-top: auto;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 22px; font-weight: 600; color: var(--ridge);
    letter-spacing: 0.04em;
  }
  .footer .bar { flex: 1; height: 3px; background: var(--gold); margin: 0 24px; border-radius: 2px; }
</style>
</head>
<body>
  <div class="frame">
    <div class="masthead">
      <div>
        <div class="featured">As featured in</div>
        <div class="inc">Inc.</div>
      </div>
      <div class="listname">CPG<br><span>Power List</span></div>
    </div>

    <div class="photo">
      <div class="rank">
        <div class="num"><sup>#</sup>2</div>
        <div class="lbl">Ranked</div>
      </div>
    </div>

    <div class="who">
      <div class="name">Jeff Church</div>
      <div class="org"><img src="cpg-mark.svg" alt="">CPG Founders Group</div>
    </div>

    <div class="statement">
      <b>#2 on Inc.&rsquo;s CPG Power List</b> of 17 Agencies and 37 People Who Can Supercharge Your CPG Brand
    </div>

    <div class="footer">
      <span>inc.com</span>
      <span class="bar"></span>
      <span>cpgfoundersgroup.com</span>
    </div>
  </div>
</body>
</html>
