<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CPG Founders Group Logo v6 - Stacked</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #fff;
    }
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #1a1a1a;
    }
    .logo svg {
      width: 160px;
      height: 120px;
    }
    .logo-text {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.025em;
      text-align: center;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Back right mountain (medium height, medium shade) -->
      <path d="M30 13L41 27H19Z" fill="#d97706" />
      <!-- Center mountain (tallest, darkest, solid, with flag) -->
      <path d="M20 7L33 27H7Z" fill="#b45309" />
      <!-- Front left mountain (shortest, lightest, overlapping in front) -->
      <path d="M10 18L19 27H1Z" fill="#fbbf24" />
      <!-- Flag pole -->
      <line x1="20" y1="1" x2="20" y2="7" stroke="#92400e" stroke-width="1.8" stroke-linecap="round" />
      <!-- Flag -->
      <path d="M20.2 1L25.5 3.5L20.2 5.5" fill="#d97706" stroke="#92400e" stroke-width="0.5" stroke-linejoin="round" />
    </svg>
    <div class="logo-text">CPG Founders<br>Group</div>
  </div>
</body>
</html>
